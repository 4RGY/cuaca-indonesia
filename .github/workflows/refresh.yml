name: refresh prakiraan

on:
  schedule:
    - cron: "23 21 * * *"   # 04:23 WIB, sekali sehari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ambil data BMKG dan tulis ulang laporan
        run: python -m cuaca_indonesia.cli --tanpa-cache
      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs data/kota.json
          git diff --cached --quiet || git commit -m "chore: refresh prakiraan BMKG"
          git push
